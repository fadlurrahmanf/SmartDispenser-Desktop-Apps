[platformio]
default_envs = esp32_dispenser

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D NFC_INTERFACE_I2C=1
  -I src/onefile
  -I ../smartdispenser_firmware/.private
build_src_flags =
  -Wall
  -Wextra
  -Werror
lib_deps =
  mathertel/LiquidCrystal_PCF8574@2.3.0
  https://github.com/Seeed-Studio/PN532.git#2c47f5c836af53158c4e29685551612181fd8f9b
  rweather/Crypto@0.4.0
lib_ignore =
  NDEF

; Three independent ESP32-C3 images.  The selected image determines the
; board role; only one can be flashed to one board at a time.
[env:esp32_dispenser]
build_src_filter = -<*> +<onefile/DispenserEsp32.cpp>

[env:esp32_topup]
build_src_filter = -<*> +<onefile/TopupEsp32.cpp>

[env:esp32_perso]
build_src_filter = -<*> +<onefile/PersoEsp32.cpp>
