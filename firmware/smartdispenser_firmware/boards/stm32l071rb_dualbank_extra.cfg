# Appended after target/stm32l0.cfg is already loaded (see
# openocd_extra_args in smartdispenser_stm32l071rbt6_arduino.json).
# STM32L071RB has two 64 KiB flash banks; the stock stm32l0 target script
# only registers bank 0, so program/verify above 0x0800FFFF fails with
# "no flash bank found for address 0x0801xxxx" once firmware exceeds 64 KiB.
flash bank stm32l0.flash1 stm32lx 0x08010000 0 0 0 stm32l0.cpu
