[platformio]
default_envs = smartdispenser_dispenser

[env]
platform = ststm32@20.0.0
board = smartdispenser_stm32l071rbt6_arduino
framework = arduino
upload_protocol = stlink
debug_tool = stlink
; The generic L071 Arduino variant keeps the reset MSI clock at 2.097152 MHz.
; This standard-mode timing is calculated for that actual I2C1 PCLK1 source.
; If SystemClock_Config changes, recalculate this value.
; I2C_TIMEOUT_TICK is STM32duino's HAL clock-stretch/transfer timeout
; (twi.c, milliseconds). Widened from the default 20ms so a PN532 holding
; SCL for its stretch window is not aborted mid-transfer.
build_flags =
  -D I2C_TIMING_SM=0x00100607
  -D I2C_TIMEOUT_TICK=100
  -I src/onefile
  -I .private
build_src_flags =
  -Wall
  -Wextra
  -Werror
  -fstack-usage
lib_deps =
  mathertel/LiquidCrystal_PCF8574@2.3.0
  https://github.com/Seeed-Studio/PN532.git#2c47f5c836af53158c4e29685551612181fd8f9b
  rweather/Crypto@0.4.0
lib_ignore =
  NDEF

; Three application images share the compact Block 9 format and AES-CMAC
; helper. Dispenser.cpp is device A; Perso.cpp and Topup.cpp
; are two separate firmware images for the SAME device B hardware -- flash
; whichever mode is needed. All three share ONE fixed, compiled-in Key A/B
; (NOT per-card derived, NOT encrypted, NOT anti-forgery signed) so cards
; personalized by Perso.cpp are readable by Topup.cpp and Dispenser.cpp. The
; compact MAC secret lives under ignored .private and is not sent to desktop.
;
; The earlier encrypted/modular architecture (per-card derived keys, GCM
; envelope, CMAC-signed master, provisioning tooling) is archived, not
; deleted -- see firmware_smartdispenser_firmware_archive_*.zip one level up
; from this project folder.
[env:smartdispenser_dispenser]
build_src_filter = -<*> +<onefile/Dispenser.cpp>
build_flags =
  ${env.build_flags}
  -D NFC_INTERFACE_I2C=1
  -Wl,--defsym=__ab_stack_reserve__=8192
  -D SMARTDISPENSER_ENABLE_INTERNAL_I2C_PULLUPS=1

[env:smartdispenser_perso]
build_src_filter = -<*> +<onefile/Perso.cpp>
build_flags =
  ${env.build_flags}
  -D NFC_INTERFACE_I2C=1
  -Wl,--defsym=__ab_stack_reserve__=8192
  -D SMARTDISPENSER_ENABLE_INTERNAL_I2C_PULLUPS=1

[env:smartdispenser_topup]
build_src_filter = -<*> +<onefile/Topup.cpp>
build_flags =
  ${env.build_flags}
  -D NFC_INTERFACE_I2C=1
  -Wl,--defsym=__ab_stack_reserve__=8192
  -D SMARTDISPENSER_ENABLE_INTERNAL_I2C_PULLUPS=1

